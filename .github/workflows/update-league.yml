name: Update ESPN League Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-league:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull ESPN league data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python update_league.py

      - name: Save updated league data
        run: |
          git config user.name "JDC Degenerates Bot"
          git config user.email "actions@github.com"
          git add league-data.json

          if git diff --cached --quiet; then
            echo "No league changes to save."
          else
            git commit -m "Update ESPN league data"
            git push
          fi
